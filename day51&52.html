<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Webpage Title -->
    <title>JavaScript</title>
</head>

<body>

    <script>

        // Event Loop Demonstration
        console.log("Start");

        // Executes after the Call Stack is empty
        // Even with 0ms delay, it waits in the Callback Queue
        setTimeout(() => {
            console.log("Inside setTimeout (Callback Queue)");
        }, 0);

        // Promise callback goes into the Microtask Queue
        // Microtasks execute before Callback Queue tasks
        Promise.resolve().then(() => {
            console.log("Inside Promise (Microtask Queue)");
        });

        console.log("End");


        // Promise Example
        // Creates a Promise that resolves after 2 seconds
        function fetchData() {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    let data = "Fetched Data";
                    // Promise successfully resolved
                    resolve(data);
                }, 2000);
            });
        }

        // Consuming the Promise using .then() and .catch()
        fetchData()
            .then(response => {
                console.log(response);
            })
            .catch(error => {
                console.log("Error:", error);
            });


        // =====================================================
        // Async / Await Example
        // =====================================================
        // Async/Await provides a cleaner way to work with Promises

        async function fetchDataAsync() {

            try {

                // Wait until fetchData() Promise resolves
                let response = await fetchData();

                console.log("Using Async-Await:", response);

            } catch (error) {

                console.log("Error:", error);

            }

        }

        // Call the async function
        fetchDataAsync();


        // =====================================================
        // Fetch API Example
        // =====================================================
        // Fetches user data from a public API

        async function getUsers() {

            try {

                // Send HTTP GET request
                let response = await fetch("https://jsonplaceholder.typicode.com/users");

                // Convert response into JSON
                let users = await response.json();

                console.log("Fetched Users:", users);

            } catch (error) {

                console.log("Fetch API Error:", error);

            }

        }

        // Call the Fetch API function
        getUsers();


        // =====================================================
        // Closures Example
        // =====================================================
        // A closure allows an inner function to remember
        // variables from its outer function even after
        // the outer function has finished executing.

        function counter() {

            // Private variable
            let count = 0;

            // Return an inner function
            return function () {

                count++;

                console.log("Counter:", count);

            };

        }

        // Create a new counter
        let increment = counter();

        // Each function call remembers the previous value of 'count'
        increment();   // Counter: 1
        increment();   // Counter: 2
        increment();   // Counter: 3

    </script>

</body>

</html>
